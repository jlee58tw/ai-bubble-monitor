# Copy .env.example to .env and set SEC_USER_AGENT (with a real contact email) before `docker compose up`.
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      # SQLite on a named volume by default; set DATABASE_URL in .env to a postgresql+psycopg URL to use Postgres.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/aibm.db}
    ports: ["8000:8000"]
    volumes: ["aibm-data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  aibm-data:
