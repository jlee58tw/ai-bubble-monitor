# Metric registry. The pipeline, API and UI are driven by this file.
#
# status:          connected   -> backed by a real, working provider
#                  unavailable -> we know what we want, but no accessible source yet (UI shows UNAVAILABLE)
#                  placeholder -> future-phase metric, nothing is ingested
# classification:  reported | guidance | estimated | derived | qualitative
#
# For provider sec_edgar, `concepts` is an ordered list of us-gaap XBRL concepts
# (first = preferred). `concept_overrides` lets one entity use a different list.
metrics:
  - id: capex_total
    name: Total company capital expenditures (cash)
    description: >-
      Purchases of property & equipment from the cash-flow statement, quarterly.
      TOTAL COMPANY capex - this is NOT AI capex. No company tagged here discloses AI-only capex in XBRL.
    unit: USD
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: reported
    provider: sec_edgar
    status: connected
    is_ai_specific: false
    warning: "Total company CapEx, not AI-specific. Excludes finance-lease additions (material for MSFT/ORCL/META)."
    methodology: >-
      Cash-flow statements in 10-Q are year-to-date. Q1 is reported directly; Q2/Q3/Q4 are DERIVED as
      YTD(n) - YTD(n-3 months) unless the filer reports a discrete 3-month value (e.g. Amazon), in which case the
      reported value is used.
    entities: [MSFT, GOOGL, AMZN, META, ORCL, NVDA]
    concepts: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]
    concept_overrides:
      AMZN: [PaymentsToAcquireProductiveAssets, PaymentsToAcquirePropertyPlantAndEquipment]
      NVDA: [PaymentsToAcquireProductiveAssets, PaymentsToAcquirePropertyPlantAndEquipment]

  - id: operating_cash_flow
    name: Operating cash flow
    description: Net cash provided by operating activities, quarterly.
    unit: USD
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: reported
    provider: sec_edgar
    status: connected
    methodology: Same YTD -> quarterly treatment as capex_total.
    entities: [MSFT, GOOGL, AMZN, META, ORCL, NVDA]
    concepts: [NetCashProvidedByUsedInOperatingActivities]

  - id: revenue
    name: Total revenue
    description: Total company revenue, quarterly. Q4 is derived as FY - 9M YTD.
    unit: USD
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: reported
    provider: sec_edgar
    status: connected
    entities: [MSFT, GOOGL, AMZN, META, ORCL, NVDA]
    concepts: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues, SalesRevenueNet]
    concept_overrides:
      GOOGL: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax]
      NVDA: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax]

  # ---------------- derived ----------------
  - id: fcf
    name: Free cash flow (OCF - CapEx)
    description: operating_cash_flow - capex_total for the same period.
    unit: USD
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: derived
    provider: derived
    status: connected
    methodology: "FCF = operating_cash_flow - capex_total (same period_start/period_end). Simple definition; excludes finance-lease principal repayments."
    entities: [MSFT, GOOGL, AMZN, META, ORCL, NVDA]
    derive: {op: subtract, inputs: [operating_cash_flow, capex_total]}

  - id: capex_to_revenue
    name: CapEx / Revenue
    description: capex_total divided by revenue, same quarter.
    unit: ratio
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: derived
    provider: derived
    status: connected
    methodology: "capex_total / revenue, same period."
    entities: [MSFT, GOOGL, AMZN, META, ORCL, NVDA]
    derive: {op: ratio, inputs: [capex_total, revenue]}

  - id: capex_to_ocf
    name: CapEx / Operating cash flow
    description: capex_total divided by operating_cash_flow, same quarter. >1 means capex exceeds internally generated cash.
    unit: ratio
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: derived
    provider: derived
    status: connected
    methodology: "capex_total / operating_cash_flow, same period. Not computed when OCF <= 0."
    entities: [MSFT, GOOGL, AMZN, META, ORCL, NVDA]
    derive: {op: ratio, inputs: [capex_total, operating_cash_flow], positive_denominator: true}

  - id: capex_yoy
    name: CapEx YoY growth
    unit: pct
    description: Quarterly capex vs the same fiscal quarter one year earlier.
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: derived
    provider: derived
    status: connected
    methodology: "value / value(period ending ~1 year earlier, +/-20 days) - 1. Not computed when prior value <= 0."
    entities: [MSFT, GOOGL, AMZN, META, ORCL, NVDA]
    derive: {op: yoy, inputs: [capex_total]}

  - id: revenue_yoy
    name: Revenue YoY growth
    unit: pct
    description: Quarterly revenue vs same quarter one year earlier.
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: derived
    provider: derived
    status: connected
    methodology: "value / value(1y earlier) - 1."
    entities: [MSFT, GOOGL, AMZN, META, ORCL, NVDA]
    derive: {op: yoy, inputs: [revenue]}

  - id: ocf_yoy
    name: Operating cash flow YoY growth
    unit: pct
    description: Quarterly OCF vs same quarter one year earlier.
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: derived
    provider: derived
    status: connected
    methodology: "value / value(1y earlier) - 1. Not computed when prior value <= 0."
    entities: [MSFT, GOOGL, AMZN, META, ORCL, NVDA]
    derive: {op: yoy, inputs: [operating_cash_flow]}

  - id: fcf_yoy
    name: FCF YoY growth
    unit: pct
    description: Quarterly FCF vs same quarter one year earlier.
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: derived
    provider: derived
    status: connected
    methodology: "value / value(1y earlier) - 1. Not computed when prior FCF <= 0 (growth from a negative base is meaningless)."
    entities: [MSFT, GOOGL, AMZN, META, ORCL, NVDA]
    derive: {op: yoy, inputs: [fcf]}

  - id: capex_total_big4_cal
    name: Big-4 hyperscaler capex (calendar-quarter sum)
    description: Sum of capex_total for MSFT, GOOGL, AMZN, META for calendar quarters where all four have data.
    unit: USD
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: derived
    provider: derived
    status: connected
    warning: "Total company CapEx, not AI-specific. ORCL excluded (non-calendar fiscal quarters)."
    methodology: "Sum over MSFT, GOOGL, AMZN, META of capex_total with identical period_end; emitted only when all 4 present."
    entities: [BIG4_CAL]
    derive: {op: sum_entities, inputs: [capex_total], members: [MSFT, GOOGL, AMZN, META]}

  - id: capex_total_big4_cal_yoy
    name: Big-4 hyperscaler capex YoY
    unit: pct
    description: YoY growth of the Big-4 calendar-quarter capex sum.
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: derived
    provider: derived
    status: connected
    methodology: "value / value(1y earlier) - 1."
    entities: [BIG4_CAL]
    derive: {op: yoy, inputs: [capex_total_big4_cal]}

  # ---------------- macro (FRED) ----------------
  - id: us10y_yield
    name: US 10Y Treasury yield (constant maturity)
    description: FRED series DGS10 (daily). Cost-of-capital context for long-duration AI capex.
    unit: pct_points
    frequency: daily
    category: macro
    default_classification: reported
    provider: fred
    status: connected
    methodology: "Downloaded from fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10. publication_date is approximated as observation_date (no ALFRED vintage)."
    entities: [US]
    series_id: DGS10

  # ---------------- unavailable / placeholder ----------------
  - id: ai_capex_disclosed
    name: AI-specific capex (company disclosed)
    description: No hyperscaler reports AI-only capex as a structured, audited number. Would be qualitative/guidance from earnings calls.
    unit: USD
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: qualitative
    provider: null
    status: unavailable
    is_ai_specific: true
    warning: "Unavailable - do NOT substitute total capex."
    entities: [MSFT, GOOGL, AMZN, META, ORCL]

  - id: capex_guidance
    name: Forward capex guidance
    description: Management capex guidance from earnings calls / 8-K exhibits. No structured source connected.
    unit: USD
    frequency: quarterly
    category: hyperscaler_capex
    default_classification: guidance
    provider: null
    status: placeholder
    is_ai_specific: false
    entities: [MSFT, GOOGL, AMZN, META, ORCL]

  - id: ai_revenue_disclosed
    name: AI revenue / run-rate (company disclosed)
    description: e.g. Microsoft AI run-rate statements. Qualitative, irregular; no structured source connected.
    unit: USD
    frequency: irregular
    category: ai_monetization
    default_classification: qualitative
    provider: null
    status: placeholder
    is_ai_specific: true
    entities: [MSFT, GOOGL, AMZN, META, ORCL]

  # ---------------- AI supply chain: dimensional XBRL (Phase 2) ----------------
  - id: nvda_datacenter_revenue
    name: NVIDIA Data Center revenue (market platform)
    description: >-
      NVIDIA revenue for the Data Center market platform, parsed from the DIMENSIONAL XBRL facts in each 10-Q / 10-K
      instance document on SEC EDGAR Archives (srt:ProductOrServiceAxis = nvda:DataCenterMember). The 10-K only
      reports the fiscal year, so Q4 is DERIVED as FY - 9M YTD (Q3 10-Q).
    unit: USD
    frequency: quarterly
    category: ai_supply_chain
    default_classification: reported
    provider: sec_filing_xbrl
    status: connected
    is_ai_specific: true
    warning: "Data Center includes networking and non-AI compute; it is the closest audited AI-demand proxy, not 'AI revenue'."
    methodology: >-
      Source = SEC EDGAR filing XBRL instance (same numbers as the 10-Q/10-K revenue-by-market table). NVIDIA
      investor-relations press releases are not scraped: the SEC filing is the audited, machine-readable original.
    entities: [NVDA]
    concepts: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax]
    params: {axis: "srt:ProductOrServiceAxis", member: "nvda:DataCenterMember"}

  # ---------------- valuation: Taiwan (TWSE open data) ----------------
  - id: tw_price_close
    name: Closing price (TWSE)
    description: Daily closing price from the Taiwan Stock Exchange (TWD, NOT adjusted for dividends).
    unit: TWD
    frequency: daily
    category: valuation
    default_classification: reported
    provider: twse
    status: connected
    methodology: "www.twse.com.tw exchangeReport/STOCK_DAY (monthly JSON, one request per stock-month, >= 3 s apart). ROC dates converted to ISO."
    entities: ["2330", "2382", "2317"]

  - id: tw_pe_trailing
    name: Trailing P/E (TWSE-computed)
    description: >-
      Price / earnings ratio published daily by TWSE (BWIBBU_ALL): closing price over the trailing four quarters'
      EPS. This is a TRAILING multiple, NOT forward P/E. Empty when EPS is negative or unavailable.
    unit: ratio
    frequency: daily
    category: valuation
    default_classification: reported
    provider: twse
    status: connected
    methodology: "openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL (latest trading day only; history accumulates one snapshot per run)."
    entities: ["2330", "2382", "2317"]

  - id: tw_pb_ratio
    name: Price / book (TWSE-computed)
    description: P/B ratio published daily by TWSE (BWIBBU_ALL).
    unit: ratio
    frequency: daily
    category: valuation
    default_classification: reported
    provider: twse
    status: connected
    entities: ["2330", "2382", "2317"]

  - id: tw_dividend_yield
    name: Dividend yield (TWSE-computed)
    description: Dividend yield published daily by TWSE (BWIBBU_ALL), stored as a fraction.
    unit: pct
    frequency: daily
    category: valuation
    default_classification: reported
    provider: twse
    status: connected
    entities: ["2330", "2382", "2317"]

  - id: tw_shares_outstanding
    name: Common shares issued (TWSE company profile)
    description: "已發行普通股數 from TWSE open data t187ap03_L (listed-company basic information), snapshot per run."
    unit: shares
    frequency: daily
    category: valuation
    default_classification: reported
    provider: twse
    status: connected
    methodology: "openapi.twse.com.tw/v1/opendata/t187ap03_L; observation date = 出表日期 (table date)."
    entities: ["2330", "2382", "2317"]

  - id: tw_market_cap
    name: Market capitalization (TWD)
    description: Closing price x common shares issued.
    unit: TWD
    frequency: daily
    category: valuation
    default_classification: derived
    provider: derived
    status: connected
    warning: "Uses the nearest shares snapshot within 45 days; shares history starts when ingestion started."
    methodology: "tw_price_close x tw_shares_outstanding (nearest shares snapshot within 45 days of the price date)."
    entities: ["2330", "2382", "2317"]
    derive: {op: multiply_asof, inputs: [tw_price_close, tw_shares_outstanding], max_gap_days: 45}

  - id: tw_drawdown_52w
    name: Drawdown from 52-week high (TWSE close)
    description: close / max(close over the trailing 365 days) - 1. Only computed when a full 52-week window of history exists.
    unit: pct
    frequency: daily
    category: valuation
    default_classification: derived
    provider: derived
    status: connected
    warning: "Unadjusted closes: ex-dividend drops slightly overstate the drawdown."
    methodology: "value_t / max(value over (t-365d, t]) - 1; requires the first observation to be <= t-358d."
    entities: ["2330", "2382", "2317"]
    derive: {op: drawdown_52w, inputs: [tw_price_close]}

  # ---------------- valuation: US (optional keyed source) ----------------
  - id: us_price_close
    name: Closing price (US listing)
    description: >-
      Daily close from Alpha Vantage TIME_SERIES_DAILY (official API, free key). Only active when ALPHAVANTAGE_API_KEY
      is set; otherwise every series is UNAVAILABLE. Free tier returns ~100 most recent sessions (compact).
    unit: USD
    frequency: daily
    category: valuation
    default_classification: reported
    provider: alphavantage
    status: connected
    warning: "Requires ALPHAVANTAGE_API_KEY. Not split/dividend adjusted. TSM = NYSE ADR (1 ADR = 5 shares)."
    entities: [NVDA, AMD, MSFT, GOOGL, AMZN, META, ORCL, TSM]

  - id: us_drawdown_52w
    name: Drawdown from 52-week high (US close)
    description: As tw_drawdown_52w, from us_price_close. Needs 52 weeks of stored history (compact API = ~100 days, so history must accumulate).
    unit: pct
    frequency: daily
    category: valuation
    default_classification: derived
    provider: derived
    status: connected
    methodology: "value_t / max(value over (t-365d, t]) - 1; requires the first observation to be <= t-358d."
    entities: [NVDA, AMD, MSFT, GOOGL, AMZN, META, ORCL, TSM]
    derive: {op: drawdown_52w, inputs: [us_price_close]}

  - id: market_cap
    name: Market capitalization (US listings)
    description: >-
      Would be price x shares outstanding (EDGAR dei:EntityCommonStockSharesOutstanding). No unkeyed official US
      price source is available (Stooq: JS challenge; Yahoo: unofficial endpoint, not used), and multi-class issuers
      (GOOGL, META) report shares only as dimensional facts. UNAVAILABLE.
    unit: USD
    frequency: daily
    category: valuation
    default_classification: derived
    provider: null
    status: unavailable
    warning: "Unavailable - no licensed/official unkeyed US price feed."
    entities: [NVDA, AMD, MSFT, GOOGL, AMZN, META, ORCL, TSM]

  - id: forward_pe
    name: Forward P/E (consensus EPS)
    description: >-
      Forward P/E requires analyst consensus EPS estimates, which are licensed data (FactSet, LSEG, S&P, Bloomberg).
      No free, terms-compliant source exists. UNAVAILABLE for all tickers. Do NOT substitute trailing P/E.
    unit: ratio
    frequency: daily
    category: valuation
    default_classification: estimated
    provider: null
    status: unavailable
    warning: "Unavailable - consensus estimates are licensed."
    entities: [NVDA, AMD, MSFT, GOOGL, AMZN, META, ORCL, TSM, "2330", "2382", "2317"]
